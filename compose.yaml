# PostgreSQL only; Exasol Personal is managed by the pinned Exasol launcher.
services:
  postgres:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_USER: advergent
      POSTGRES_DB: advergent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/configure.py first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - operational:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U advergent -d advergent"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  operational:
