[project]
name = "advergent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.162.0", "uvicorn==0.54.0", "sqlalchemy==2.1.6", "psycopg[binary]==3.3.6", "pyexasol==3.0.1"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
markers = ["integration: requires real PostgreSQL and Exasol"]
